name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        # tests/darko is an offline sub-project with isolated deps
        # (requirements-darko.txt) that prod CI doesn't install; run it locally.
        run: pytest tests/ --ignore=tests/darko
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: JS helper tests
        run: node --test 'tests/js/**/*.test.js'
      - name: Install browser test deps
        run: npm ci
      - name: Browser smoke tests
        # Spawns the seeded ESPN-stubbed server (tests/browser/smoke_server.py)
        # and launches the runner's preinstalled Chrome (--headless --no-sandbox).
        run: node --test 'tests/browser/**/*.test.js'
