name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff==0.15.7
      - name: Lint
        run: ruff check .
      - name: Test
        # tests/darko is an offline sub-project with isolated deps
        # (requirements-darko.txt) that prod CI doesn't install; run it locally.
        run: pytest tests/ --ignore=tests/darko
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS helper tests
        run: node --test 'tests/js/**/*.test.js'
