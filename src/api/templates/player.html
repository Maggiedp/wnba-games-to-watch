<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ title }}</title>
        <meta name="description" content="{{ summary }}">
        <meta property="og:title" content="{{ name }}">
        <meta property="og:description" content="{{ summary }}">
        <meta property="og:type" content="article">
        <meta property="og:url" content="{{ site_url }}/player/{{ athlete_id }}">
        <meta property="og:image" content="{{ site_url }}/player/{{ athlete_id }}/og.png">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:image:type" content="image/png">
        <meta property="og:image:alt" content="{{ summary }}">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="{{ name }}">
        <meta name="twitter:description" content="{{ summary }}">
        <meta name="twitter:image" content="{{ site_url }}/player/{{ athlete_id }}/og.png">
{{ shared_head | safe }}
        <style>
            main { max-width: 760px; margin: 0 auto; padding: 36px 24px 80px; width: 100%; flex: 1; }
            h1.player-name {
                font-family: var(--display); font-variation-settings: 'opsz' 144;
                font-weight: 900; font-size: clamp(2rem, 6vw, 3.1rem); line-height: 1.04;
                letter-spacing: -0.02em; margin: 10px 0 0;
            }
            .player-sub { color: var(--text-muted); font-size: 0.95rem; margin: 6px 0 0; }
            .player-headline { color: var(--text-muted); font-size: 1.05rem; margin: 10px 0 0; }
            .stat-header {
                display: flex; flex-wrap: wrap; gap: 22px; margin: 26px 0 8px;
            }
            .stat { display: flex; flex-direction: column; }
            .stat .v { font-family: var(--display); font-weight: 700; font-size: 1.5rem;
                       font-feature-settings: 'tnum' on; }
            .stat.big .v { font-size: 2.2rem; }
            .stat .v.is-positive { color: var(--orange-deep); }
            .stat .v.is-negative { color: #7a7f88; }
            .stat .k { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em;
                       color: var(--text-subtle); margin-top: 2px; }
            .xpps-mark { color: var(--text-subtle); font-size: 0.9rem; margin-left: 4px; }
            .degrade-note { color: var(--text-muted); margin: 20px 0 0; }

            /* --- shot-chart + diet + zones: duplicated from shot_making.html
               (2nd caller; lift the shared subset into _SHARED_HEAD on a 3rd). --- */
            .diet-bar { display: flex; width: 160px; height: 12px; border-radius: 4px;
                        overflow: hidden; background: var(--surface-2, #f2f4f7); margin: 4px 0 0; }
            .diet-seg { display: block; height: 100%; }
            .diet-rim { background: var(--orange-deep); }
            .diet-floater { background: var(--orange); }
            .diet-mid { background: #d9a441; }
            .diet-three { background: var(--navy); }
            .diet-other { background: #c7ccd4; }
            .chart-wrap { max-width: 460px; margin: 8px 0 0; }
            .shot-chart-svg { width: 100%; height: auto; display: block; }
            .shot-legend { display: flex; align-items: center; gap: 8px; justify-content: center;
                margin-top: 8px; font-size: 11px; color: var(--text-muted); }
            .shot-legend .grad { width: 120px; height: 10px; border-radius: 5px;
                background: linear-gradient(90deg,#5b6472,#c9cdd4,#f4c9a6,#e8641e); }
            .shot-cap { font-size: 11.5px; color: var(--text-subtle); margin: 10px 0 0; line-height: 1.5; }
            .shot-zones { font-size: 13px; max-width: 460px; margin-top: 20px; }
            .shot-zones .zt, .shot-zones .zr {
                display: grid; grid-template-columns: 1.4fr .7fr .7fr .8fr; gap: 4px; align-items: center; }
            .shot-zones .zt { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
                color: var(--text-subtle); border-bottom: 1px solid var(--navy-3); padding-bottom: 5px; }
            .shot-zones .zr { padding: 7px 0; border-bottom: 1px solid rgba(0,0,0,0.06); }
            .shot-zones .zt span:not(:first-child), .shot-zones .zr span:not(:first-child) { text-align: right; }
            .shot-zones .zr .pos { color: var(--orange-deep); font-weight: 600; }
            .shot-zones .zr .neg { color: #7a7f88; }
            .shot-zones .sw { display:inline-block; width:9px; height:9px; border-radius:2px;
                margin-right:5px; vertical-align:middle; }
        </style>
    </head>
    <body>
        {{ site_nav | safe }}
        <main>
            <h1 class="player-name">{{ name }}</h1>
            <p class="player-sub">{{ subtitle }}</p>
            <p class="player-headline">{{ summary }}</p>

            {{ stat_header | safe }}

            <div class="chart-wrap">
                <div id="shot-chart"></div>
                <div class="shot-legend"><span>Worse than average</span>
                    <span class="grad"></span><span>Better than average</span></div>
                <p class="shot-cap">Each dot is one shot, colored by points added vs. a
                    league-average shooter from that spot &amp; type.</p>
            </div>

            {{ zones_html | safe }}
        </main>

        <script type="application/json" id="shot-data">{{ chart | tojson }}</script>
        <script>{{ shot_chart_js | safe }}</script>
        <script>
            (function () {
                var el = document.getElementById('shot-chart');
                try {
                    var shots = JSON.parse(document.getElementById('shot-data').textContent);
                    el.innerHTML = buildShotChartSvg(shots);
                } catch (e) {
                    console.error('shot chart render failed', e);
                }
            })();
        </script>
    </body>
    </html>
