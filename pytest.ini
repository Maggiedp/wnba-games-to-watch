[pytest]
# A bare threading.Thread SWALLOWS whatever its target raises. Python routes it
# to threading.excepthook and pytest downgrades it to a warning, so a test whose
# assertions only read a side effect (a build count, a send count, an Event that
# was already set) passes while the worker thread died. Turning that warning
# into an error is the repo's floor for every thread in tests/, including the
# ones nobody has written yet.
#
# Keep this list minimal. It is a floor for defects that would otherwise be
# invisible, not a place to make the suite strict about warnings in general --
# the starlette/httpx deprecation warning is exactly the kind of noise that
# should NOT be an error here.
filterwarnings =
    error::pytest.PytestUnhandledThreadExceptionWarning
