# Ruff configuration. Run: `ruff check .`
target-version = "py313"

[lint]
# Pin the rule set explicitly (currently ruff's defaults) so a future ruff
# release can't silently drop the pyflakes `F` checks — those catch the
# undefined-name / unused-import class of bug this baseline exists to guard.
select = ["E4", "E7", "E9", "F"]
